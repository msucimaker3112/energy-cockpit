<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>energy-cockpit 3D-Ansicht Test</title>
<style>html,body{margin:0;background:#05070d;color:#e8eefc;font-family:system-ui}#host{max-width:1200px;margin:0 auto;padding:8px}#res{white-space:pre-wrap;font:12px monospace;padding:8px}</style></head>
<body><div id="host"></div><div id="res"></div>
<script src="_icons.js"></script><script src="../dist/energy-cockpit.js"></script><script src="_theme.js"></script>
<script>
/* Prüft style: 3d. Aufruf: ?test=1&still=1, ohne test zeigt die Seite die Karte (?case=normal|strings|stapel|via|zwei|flach, &w=Breite, &kurz=1, &theme=hell) */
const S=(v,u)=>({state:String(v),attributes:{unit_of_measurement:u||'W'},last_updated:'x'});
const hassFor=(o)=>({states:Object.assign({'sensor.pv':S(1240),'sensor.grid':S(354),'sensor.bat':S(620),'sensor.bat2':S(-150),'sensor.soc':S(64,'%'),'sensor.soc2':S(22,'%'),'sensor.ch':S(96),'sensor.dis':S(0),'sensor.out':S(0),'sensor.s0':S(4,'%'),'sensor.s1':S(22,'%'),'sensor.s1w':S(400),'sensor.s2w':S(467),'sensor.s3w':S(213),'sensor.s4w':S(160),'sensor.wp':S(600),'sensor.pv2':S(300)},o||{}),language:'de',locale:{language:'de'},config:{currency:'EUR'},callApi:async()=>[],callWS:async()=>({})});
const base={pv:{entity:'sensor.pv'},grid:{entity:'sensor.grid'},battery:{power:'sensor.bat',soc:'sensor.soc',capacity_kwh:10},style:'3d'};
const cases={
  normal:base,
  strings:{...base,pv:{entity:'sensor.pv',strings:[{entity:'sensor.s1w',name:'S1'},{entity:'sensor.s2w',name:'S2'},{entity:'sensor.s3w',name:'S3'},{entity:'sensor.s4w',name:'S4'}]}},
  flach:{...base,house_style:'flach'},
  zwei:{...base,pv2:{entity:'sensor.pv2',name:'BKW'},batteries:[{name:'Zweiter',power:'sensor.bat2',soc:'sensor.soc2',capacity_kwh:5}],consumers:[{name:'WP',entity:'sensor.wp'}]},
  stapel:{...base,battery:{name:'Nexa',power_charge:'sensor.ch',power_discharge:'sensor.dis',soc:'sensor.s0',capacity_kwh:2},batteries:[{name:'Noah',power_charge:'sensor.ch',power_discharge:'sensor.dis',soc:'sensor.s1',capacity_kwh:2}]},
  via:{...base,pv_to_battery:'direkt',battery:{name:'B2500',power_out:'sensor.out',soc:'sensor.soc',capacity_kwh:2}},
};
function mount(c,h){const host=document.getElementById('host');host.innerHTML='';const e=document.createElement('energy-cockpit-flow-card');e.setConfig(JSON.parse(JSON.stringify(c)));host.appendChild(e);e.hass=h;return e;}
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const q=(e,s)=>e.shadowRoot.querySelector(s),qa=(e,s)=>[...e.shadowRoot.querySelectorAll(s)];
const lines=[];let fail=0;
const ok=(n,v,x)=>{if(!v)fail++;lines.push((v?'OK   ':'FAIL ')+n+(x!==undefined?' -> '+x:''));};
async function run(){
  const {style,...off}=base;
  let e=mount(off,hassFor());await wait(600);
  ok('ohne Option: keine 3D-Klasse und keine Objekte',!q(e,'.s3d')&&!q(e,'.o3d'));
  e=mount(base,hassFor());await wait(600);
  ok('mit Option: vier Objekte',qa(e,'.o3d svg').length===4,qa(e,'.o3d svg').length);
  ok('Hausverbrauch als Zahl',!!q(e,'.core .num')&&q(e,'.core .num').textContent!=='—',q(e,'.core .num').textContent);
  ok('Akku: Prozentzahl auf der Front',/64 %/.test(q(e,'[data-o="bat"] svg').textContent),q(e,'[data-o="bat"] svg').textContent);
  ok('Netz: Wert auf dem Display',/354 W/.test(q(e,'[data-o="grid"] svg').textContent),q(e,'[data-o="grid"] svg').textContent);
  ok('Kacheln behalten ihre Werte',q(e,'[data-k="bat"] .num').textContent!=='—'&&q(e,'[data-k="pv"] .num').textContent!=='—');
  const first=q(e,'[data-o="bat"] svg');
  e.hass=hassFor();await wait(100);
  ok('gleiche Werte: Objekt wird nicht neu gezeichnet',q(e,'[data-o="bat"] svg')===first);
  e.hass=hassFor({'sensor.soc':S(70,'%')});await wait(100);
  ok('neuer Ladestand: Objekt folgt',/70 %/.test(q(e,'[data-o="bat"] svg').textContent));
  e=mount(cases.strings,hassFor());await wait(600);
  ok('Strings: je String ein beschriftetes Modul',/400 W/.test(q(e,'[data-o="pv"] svg').textContent)&&/160 W/.test(q(e,'[data-o="pv"] svg').textContent),q(e,'[data-o="pv"] svg').textContent);
  e=mount(cases.stapel,hassFor());await wait(600);
  ok('gemeinsamer Sensor: beide Akkus zeigen Laden',q(e,'[data-o="bat2"] svg .d3-lamp')!==null);
  ok('gemeinsamer Sensor: Zahl nur einmal',q(e,'[data-k="bat"] .num').textContent==='96'&&q(e,'[data-k="bat2"] .num').textContent==='—');
  e=mount(cases.zwei,hassFor());await wait(600);
  ok('zwei Anlagen, zwei Speicher: alle Objekte',qa(e,'.o3d svg').length===6,qa(e,'.o3d svg').length);
  e=mount(cases.via,hassFor());await wait(600);
  ok('pv_to_battery: Objekte vorhanden',qa(e,'.o3d svg').length===4);
  e=mount(cases.flach,hassFor());await wait(600);
  ok('Flachdach gewählt',q(e,'[data-o="home"] svg').innerHTML!=='' );
  const miss=hassFor();delete miss.states['sensor.soc'];delete miss.states['sensor.grid'];
  e=mount(base,miss);await wait(600);
  ok('fehlende Sensoren: kein Absturz',qa(e,'.o3d svg').length===4&&/—/.test(q(e,'[data-o="bat"] svg').textContent));
  document.getElementById('res').textContent=`${fail?'FEHLER '+fail:'ALLE OK'}\n`+lines.join('\n');
}
const P=new URLSearchParams(location.search);
if(P.get('test')){document.getElementById('host').style.height='0';run();}
else{if(P.get('w'))document.getElementById('host').style.maxWidth=P.get('w')+'px';const c={...cases[P.get('case')||'normal']};if(P.get('kurz'))c.compact='immer';const t=P.get('theme');if(t)c.theme=t;mount(c,hassFor());}
</script></body></html>
