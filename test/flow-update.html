<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>energy-cockpit Takt und Hochzählen Test</title>
<style>html,body{margin:0;background:#05070d;color:#e8eefc;font-family:system-ui}#host{max-width:1100px;margin:0 auto;padding:8px}#res{white-space:pre-wrap;font:12px monospace;padding:8px}</style></head>
<body><div id="host"></div><div id="res"></div>
<script src="_icons.js"></script><script src="../dist/energy-cockpit.js"></script>
<script>
/* Prüft: höchstens ein Durchlauf je Sekunde, nur große Sprünge zählen hoch. Aufruf: ?test=1&still=1 */
const S=(v,u)=>({state:String(v),attributes:{unit_of_measurement:u||'W'},last_updated:'x'});
const hassFor=(pv)=>({states:{'sensor.pv':S(pv),'sensor.grid':S(100),'sensor.bat':S(0),'sensor.soc':S(50,'%')},language:'de',locale:{language:'de'},config:{currency:'EUR'},callApi:async()=>[],callWS:async()=>({})});
const cfg={pv:{entity:'sensor.pv'},grid:{entity:'sensor.grid'},battery:{power:'sensor.bat',soc:'sensor.soc',capacity_kwh:5}};
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const lines=[];let fail=0;
const ok=(n,v,x)=>{if(!v)fail++;lines.push((v?'OK   ':'FAIL ')+n+(x!==undefined?' -> '+x:''));};
async function run(){
  const host=document.getElementById('host');
  const e=document.createElement('energy-cockpit-flow-card');e.setConfig(cfg);host.appendChild(e);
  const num=()=>e.shadowRoot.querySelector('[data-k="pv"] .num').textContent;
  let calls=0;const orig=e._update;e._update=function(){calls++;return orig.apply(this,arguments);};
  e.hass=hassFor(500);await wait(0);
  ok('erster Wert sofort',num()==='500',num());
  const c0=calls;
  for(let i=0;i<8;i++){e.hass=hassFor(501+i);await wait(50);}
  ok('viele Werte in kurzer Zeit: kein Durchlauf dazwischen',calls===c0,calls-c0);
  await wait(1300);
  ok('danach steht der letzte Wert da',num()==='508',num());
  ok('nur ein Durchlauf für alle Werte',calls===c0+1,calls-c0);
  await wait(1100);e.hass=hassFor(530);await wait(30);
  ok('kleine Änderung: sofort, ohne Hochzählen',num()==='530'&&!e._raf,num());
  await wait(1100);e.hass=hassFor(2000);await wait(120);
  ok('großer Sprung: zählt hoch',!!e._raf&&num()!=='2,00',num());
  await wait(1200);
  ok('großer Sprung: Endwert stimmt',num()==='2,00',num());
  await wait(1100);e.hass=hassFor(2010);await wait(30);
  ok('Einheit bleibt bei kleiner Änderung richtig',num()==='2,01'&&e.shadowRoot.querySelector('[data-k="pv"] .unit').textContent==='kW',num());
  document.getElementById('res').textContent=`${fail?'FEHLER '+fail:'ALLE OK'}\n`+lines.join('\n');
}
if(new URLSearchParams(location.search).get('test'))run();
</script></body></html>
