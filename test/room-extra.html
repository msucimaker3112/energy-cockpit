<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Energy-Cockpit Raum-Abrechnung Zusatzfunktionen</title>
<style>html,body{margin:0;background:#05070d;color:#e8eefc;font-family:system-ui}#host{max-width:1100px;margin:0 auto;padding:8px}</style></head>
<body><div id="host"></div>
<script src="_icons.js"></script><script src="../dist/energy-cockpit.js"></script>
<script>
const S=(state,a)=>({state:String(state),attributes:a||{},last_changed:new Date().toISOString(),last_updated:'x'});
const states={
  'input_number.price':S(0.34),'input_number.feed':S(0.06),'input_number.abschlag':S(35),
  'sensor.p1':S(412,{unit_of_measurement:'W'}),'sensor.p2':S(0,{unit_of_measurement:'W'}),
  'sensor.archiv':S(2,{monate:[
    {k:'2026-09',kwh:48.2,g:30.1,b:8.4,p:9.7,cost:15.12,full:16.39,pg:0.34,pf:0.06,ab:35,dev:[{n:'Arbeitsplätze',a:10.2,e:52.4,kwh:42.2},{n:'Chillecke',a:2.1,e:8.1,kwh:6}]},
    {k:'2026-10',kwh:51.0,g:28.0,b:9.5,p:13.5,cost:16.8,full:17.34,pg:0.34,pf:0.06,ab:35,dev:[{n:'Arbeitsplätze',a:52.4,e:97.6,kwh:45.2},{n:'Chillecke',a:8.1,e:13.9,kwh:5.8}]}]})
};
// Stundenwerte der letzten 40 Tage: Arbeitsplätze tagsüber an, nachts 60 W Standby, Chillecke selten
const H=3600e3;
const hass={states,language:'de',config:{currency:'EUR'},callWS:async(m)=>{
  const r={};const end=Math.floor(Date.now()/H)*H, start=end-40*24*H;
  if(m.period==='day'){ m.statistic_ids.forEach((id)=>{r[id]=[];for(let t=start;t<=end;t+=24*H){r[id].push({start:t,change:id==='sensor.e1'?1.4:0.2});}}); return r; }
  m.statistic_ids.forEach((id)=>{r[id]=[];for(let t=start;t<=end;t+=H){const d=new Date(t),h=d.getHours(),wd=d.getDay();
    let v=0;
    if(id==='sensor.e1') v=(wd>0&&wd<6&&h>=8&&h<18)?0.45+((h*7)%3)/20:(h<5?0.06:0.03);
    if(id==='sensor.e2') v=(h>=18&&h<22&&wd>=4)?0.15:0.004;
    if(id==='sensor.pv') v=(h>=8&&h<18)?3.5*Math.sin((h-6)/12*Math.PI):0;
    if(id==='sensor.imp') v=(h>=8&&h<18)?Math.max(0,0.8-0.15*Math.sin((h-6)/12*Math.PI)*3):0.5;
    if(id==='sensor.exp') v=(h>=10&&h<15)?1.2:0;
    if(id==='sensor.chg') v=(h>=10&&h<14)?0.8:0;
    if(id==='sensor.dis') v=(h>=18&&h<23)?0.7:0;
    r[id].push({start:t,change:v});}});
  return r;}};
const cfg={title:'Büro Keller',subtitle:'Strommiete',price:'input_number.price',feed_in:'input_number.feed',valuation:'opportunity',
  advance:'input_number.abschlag',standby_w:80,archive:'sensor.archiv',
  devices:[{energy:'sensor.e1',name:'Arbeitsplätze',power:'sensor.p1',color:'96,165,250'},{energy:'sensor.e2',name:'Chillecke',power:'sensor.p2',color:'52,211,153'}],
  home_energy:{pv:'sensor.pv',import:'sensor.imp',export:'sensor.exp',charge:'sensor.chg',discharge:'sensor.dis'}};
const c=document.createElement('energy-cockpit-room-card');c.setConfig(cfg);document.getElementById('host').appendChild(c);c.hass=hass;
window.card=c;
// Für Screenshots: ?show=head,kpis,0,1 zeigt nur die genannten Bereiche (Zahlen = Panel-Index)
const sh = new URLSearchParams(location.search).get('show');
if (sh) {
  document.body.style.background = '#111';
  const want = sh.split(',');
  setTimeout(() => {
    const r = c.shadowRoot;
    const hd = r.querySelector('header'); if (hd && want.indexOf('head') < 0) hd.style.display = 'none';
    const kp = r.querySelector('.kpis'); if (kp && want.indexOf('kpis') < 0) kp.style.display = 'none';
    r.querySelectorAll('.panel').forEach((pn, i) => { if (want.indexOf(String(i)) < 0) pn.style.display = 'none'; else if (i === +want.find((w) => /^\d+$/.test(w))) pn.style.marginTop = '0'; });
    r.querySelector('.wrap').style.paddingBottom = '22px';
  }, 1200);
}
</script></body></html>
