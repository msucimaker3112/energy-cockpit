<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>energy-cockpit große Kacheln und Textgröße Test</title>
<style>html,body{margin:0;background:#05070d;color:#e8eefc;font-family:system-ui}#host{max-width:1100px;margin:0 auto;padding:8px}#res{white-space:pre-wrap;font:12px monospace;padding:8px}</style></head>
<body><div id="host"></div><div id="res"></div>
<script src="_icons.js"></script><script src="../dist/energy-cockpit.js"></script><script src="_theme.js"></script>
<script>
/* Prüft size: gross bei Verbrauchern, text_size als Zahl und dass die Linien hinter den Kacheln laufen.
   Aufruf: ?test=1&still=1, ohne test zeigt die Seite die Karte (&ts=2, &w=Breite, &kurz=1) */
const S=(v,u)=>({state:String(v),attributes:{unit_of_measurement:u||'W'},last_updated:'x'});
const hass={states:{'sensor.pv':S(2600),'sensor.grid':S(-300),'sensor.bat':S(-600),'sensor.soc':S(71,'%'),'sensor.wp':S(1450),'sensor.wb1':S(3700),'sensor.wb2':S(0),'sensor.l':S(42),'sensor.k':S(118)},language:'de',locale:{language:'de'},config:{currency:'EUR'},callApi:async()=>[],callWS:async()=>({})};
const cons=()=>[
 {entity:'sensor.wp',name:'Wärmepumpe',icon:'mdi:heat-pump-outline',color:'#ff8a5c',size:'gross'},
 {entity:'sensor.wb1',name:'Wallbox 1',icon:'mdi:ev-station',color:'#a78bfa',size:'gross'},
 {entity:'sensor.wb2',name:'Wallbox 2',icon:'mdi:ev-station',color:'#7dd3fc',size:'gross'},
 {entity:'sensor.l',name:'Licht',icon:'mdi:lightbulb-outline',color:'#facc15'},
 {entity:'sensor.k',name:'Kühlschrank',icon:'mdi:fridge-outline',color:'#34d399'}];
const cfg=(o)=>Object.assign({pv:{entity:'sensor.pv'},grid:{entity:'sensor.grid'},battery:{power:'sensor.bat',soc:'sensor.soc',capacity_kwh:10},style:'3d',consumers:cons()},o||{});
function mount(c){const host=document.getElementById('host');host.innerHTML='';const e=document.createElement('energy-cockpit-flow-card');e.setConfig(JSON.parse(JSON.stringify(c)));host.appendChild(e);e.hass=hass;return e;}
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const q=(e,s)=>e.shadowRoot.querySelector(s);
const qa=(e,s)=>[...e.shadowRoot.querySelectorAll(s)];
const fs=(e,s)=>parseFloat(getComputedStyle(q(e,s)).fontSize);
const t=(e,s)=>{const x=q(e,s);return x?x.textContent.trim():null;};
const lines=[];let fail=0;
const ok=(n,v,x)=>{if(!v)fail++;lines.push((v?'OK   ':'FAIL ')+n+(x!==undefined?' -> '+x:''));};
async function run(){
  let e=mount(cfg());await wait(700);
  ok('drei große Kacheln',qa(e,'.cons.big').length===3,qa(e,'.cons.big').length);
  ok('Licht und Kühlschrank bleiben normal',!q(e,'[data-k="c3"]').classList.contains('big')&&!q(e,'[data-k="c4"]').classList.contains('big'));
  ok('große Kachel belegt zwei Spalten',getComputedStyle(q(e,'[data-k="c0"]')).gridColumnStart==='span 2',getComputedStyle(q(e,'[data-k="c0"]')).gridColumnStart);
  const big=fs(e,'[data-k="c1"] .num'),small=fs(e,'[data-k="c3"] .num');
  ok('große Zahl deutlich größer als bei kleiner Kachel',big>=small*1.6,big+' px gegen '+small+' px');
  ok('Wert in der großen Kachel stimmt',/3,70/.test(q(e,'[data-k="c1"] .num').textContent),q(e,'[data-k="c1"] .num').textContent);
  ok('size: big wird auch verstanden',(()=>{const x=mount(cfg({consumers:[{entity:'sensor.wp',name:'A',size:'big'}]}));return !!q(x,'.cons.big');})());
  e=mount(cfg());await wait(500);
  const bg=getComputedStyle(q(e,'[data-k="c3"]')).backgroundColor;
  ok('Verbraucher-Kachel deckt die Linien ab (undurchsichtiger Grund)',bg!=='rgba(0, 0, 0, 0)'&&!/rgba\(.*,\s*0(\.\d+)?\)$/.test(bg),bg);
  const zl=parseInt(getComputedStyle(q(e,'svg.links')).zIndex),zc=parseInt(getComputedStyle(q(e,'.consumers')).zIndex);
  ok('Linien liegen hinter den Kacheln',zl<zc,zl+' < '+zc);

  // Textgröße: gross/sehr_gross wie bisher (Zahlen unverändert), Zahl vergrößert auch die Zahlen
  const norm=fs(mount(cfg({consumers:[]})),'.node .num');
  ok('sehr_gross: Zahlen bleiben wie bisher',Math.abs(fs(mount(cfg({text_size:'sehr_gross',consumers:[]})),'.node .num')-norm)<0.5,norm);
  const n2=fs(mount(cfg({text_size:2,consumers:[]})),'.node .num');
  ok('text_size: 2 verdoppelt die Zahlen',Math.abs(n2/norm-2)<0.05,n2+' px gegen '+norm+' px');
  ok('text_size: "2" als Text wird gelesen',Math.abs(fs(mount(cfg({text_size:'2',consumers:[]})),'.node .num')/norm-2)<0.05);
  ok('text_size: "1,5" mit Komma wird gelesen',Math.abs(fs(mount(cfg({text_size:'1,5',consumers:[]})),'.node .num')/norm-1.5)<0.05);
  ok('text_size: 9 wird auf 4 begrenzt',Math.abs(fs(mount(cfg({text_size:9,consumers:[]})),'.node .num')/norm-4)<0.1);
  ok('text_size: 0.1 wird auf 0,5 begrenzt',Math.abs(fs(mount(cfg({text_size:0.1,consumers:[]})),'.node .num')/norm-0.5)<0.05);
  ok('text_size: Unsinn wird ignoriert',Math.abs(fs(mount(cfg({text_size:'abc',consumers:[]})),'.node .num')-norm)<0.5);
  const pill0=fs(mount(cfg()),'.pill');
  e=mount(cfg({text_size:2}));await wait(400);
  ok('kleine Texte wachsen mit (--ts)',fs(e,'.pill')>pill0*1.5,fs(e,'.pill')+' px gegen '+pill0+' px');
  ok('große Kachel wächst mit',fs(e,'[data-k="c1"] .num')>=big*1.9,fs(e,'[data-k="c1"] .num'));

  // size: mittel (#40): eine Spalte, Zahl zwischen normal und gross; Namen in grossen Kacheln groesser
  e=mount(cfg({consumers:[{entity:'sensor.wp',name:'WP',size:'mittel',secondary:'sensor.k'},{entity:'sensor.wb1',name:'WB',size:'gross',secondary:'sensor.k'},{entity:'sensor.l',name:'L'}]}));await wait(600);
  const nm=fs(e,'[data-k="c2"] .num'),mm=fs(e,'[data-k="c0"] .num'),gg=fs(e,'[data-k="c1"] .num');
  ok('mittel: eine Spalte',getComputedStyle(q(e,'[data-k="c0"]')).gridColumnStart==='auto'&&q(e,'[data-k="c0"]').classList.contains('mid'));
  ok('mittel: Zahl zwischen normal und gross',mm>nm*1.2&&mm<gg,nm+' < '+mm+' < '+gg);
  ok('size: mid wird auch verstanden',(()=>{const x=mount(cfg({consumers:[{entity:'sensor.wp',name:'A',size:'mid'}]}));return !!q(x,'.cons.mid');})());
  e=mount(cfg({consumers:[{entity:'sensor.wp',name:'WP',size:'gross',secondary:'sensor.k'},{entity:'sensor.l',name:'L',secondary:'sensor.k'}]}));await wait(600);
  ok('große Kachel: Name größer als bei normaler',fs(e,'[data-k="c0"] .lbl')>=fs(e,'[data-k="c1"] .lbl')*1.3,fs(e,'[data-k="c0"] .lbl')+' px gegen '+fs(e,'[data-k="c1"] .lbl')+' px');
  ok('große Kachel: Zusatzwert größer als bei normaler',fs(e,'[data-k="c0"] .c-sec')>=fs(e,'[data-k="c1"] .c-sec')*1.3,fs(e,'[data-k="c0"] .c-sec')+' px gegen '+fs(e,'[data-k="c1"] .c-sec')+' px');
  // #40: label_size trennt die Groesse der Beschriftungen von den Zahlen
  e=mount(cfg({consumers:[{entity:'sensor.l',name:'L',secondary:'sensor.k'}]}));await wait(400);const lb0=fs(e,'[data-k="c0"] .lbl');
  e=mount(cfg({consumers:[]}));await wait(400);const nm0=fs(e,'.node .num');
  e=mount(cfg({label_size:2,consumers:[{entity:'sensor.l',name:'L',secondary:'sensor.k'}]}));await wait(400);
  ok('label_size 2: Beschriftung doppelt so groß',Math.abs(fs(e,'[data-k="c0"] .lbl')/lb0-2)<0.1,fs(e,'[data-k="c0"] .lbl')+' px gegen '+lb0+' px');
  ok('label_size 2: Zahlen in den Kacheln bleiben',Math.abs(fs(e,'.node .num')-nm0)<0.5,fs(e,'.node .num')+' px gegen '+nm0+' px');
  e=mount(cfg({text_size:2,label_size:1,consumers:[{entity:'sensor.l',name:'L'}]}));await wait(400);
  ok('text_size 2 mit label_size 1: Zahlen doppelt, Beschriftung normal',Math.abs(fs(e,'.node .num')/nm0-2)<0.05&&Math.abs(fs(e,'[data-k="c0"] .lbl')/lb0-1)<0.1);
  e=mount(cfg({label_size:'abc',consumers:[{entity:'sensor.l',name:'L'}]}));await wait(300);
  ok('label_size: Unsinn wird ignoriert',Math.abs(fs(e,'[data-k="c0"] .lbl')-lb0)<0.5);
  // #40 (Micha): roof_color und label_size/text_size zusammen: die Dachfarbe darf die Groessen nicht verschlucken
  e=mount(cfg({roof_color:'anthrazit',label_size:3,text_size:'2',fit_screen:false,consumers:[{entity:'sensor.l',name:'L',secondary:'sensor.k'}]}));await wait(500);
  ok('roof_color mit label_size: --ts und --vs kommen an',getComputedStyle(q(e,'.wrap')).getPropertyValue('--ts').trim()==='3'&&getComputedStyle(q(e,'.wrap')).getPropertyValue('--vs').trim()==='2',q(e,'.wrap').getAttribute('style'));
  ok('roof_color mit label_size: Beschriftung wirklich größer',fs(e,'[data-k="c0"] .lbl')/lb0>2.5,fs(e,'[data-k="c0"] .lbl')+' px gegen '+lb0+' px');
  // size: mittel macht die Spalten breiter
  const w0=mount(cfg({consumers:[{entity:'sensor.l',name:'L'},{entity:'sensor.k',name:'K'}]}));await wait(500);const wn=q(w0,'[data-k="c0"]').getBoundingClientRect().width;
  e=mount(cfg({consumers:[{entity:'sensor.l',name:'L',size:'mittel'},{entity:'sensor.k',name:'K',size:'mittel'}]}));await wait(500);
  ok('mittel: Kachel breiter als eine normale',q(e,'[data-k="c0"]').getBoundingClientRect().width>wn*1.05,q(e,'[data-k="c0"]').getBoundingClientRect().width+' px gegen '+wn+' px');
  ok('mittel: Verbraucher-Raster bekommt Klasse hm',q(e,'.consumers').classList.contains('hm'));
  // Solar-Kachel: Zeilen untereinander, Namen: Solar statt PV-Anlage, Erzeugung statt Erzeugt
  e=mount(cfg());await wait(500);
  ok('Solar-Kachel heißt "Solar"',/^Solar$/i.test(t(e,'[data-k="pv"] .lbl')),t(e,'[data-k="pv"] .lbl'));
  ok('Tag heißt "Erzeugung"',/Erzeugung/.test(t(e,'[data-k="pv"] .tag')),t(e,'[data-k="pv"] .tag'));
  ok('Zeilen stehen untereinander (Name links, Wert rechts)',qa(e,'[data-k="pv"] .sub .sr').length>=1&&getComputedStyle(q(e,'[data-k="pv"] .sub .sr')).display==='flex',qa(e,'[data-k="pv"] .sub .sr').length);
  ok('Mix-Zeile sagt Batterie statt Akku',!/Akku/.test(t(e,'.mix'))&&/Batterie/.test(t(e,'.mix')),t(e,'.mix'));
  // #46 (Joe): Ladestand-Zeile und Zeilen "Voll um / Voll in" der Batterie-Kachel haben dieselbe Größe und Schriftstärke
  const cmpRows=async(c,label)=>{e=mount(c);await wait(700);const a=q(e,'[data-k="bat"] .soc-row'),b=q(e,'[data-k="bat"] .sub .sr');
    const fa=getComputedStyle(a).fontSize,fb=getComputedStyle(b).fontSize,wa=getComputedStyle(a.querySelector('b')).fontWeight,wb=getComputedStyle(b.querySelector('b')).fontWeight;
    ok('Batterie-Kachel '+label+': Ladestand und Zeile darunter gleich groß',!!a&&!!b&&fa===fb,fa+' gegen '+fb);
    ok('Batterie-Kachel '+label+': Werte gleich stark',wa===wb,wa+' gegen '+wb);};
  const bcfg=(o)=>cfg(Object.assign({consumers:[],battery:{power:'sensor.bat',soc:'sensor.soc',capacity_kwh:10}},o||{}));
  await cmpRows(bcfg(),'normal');
  document.getElementById('host').style.maxWidth='1100px';await cmpRows(bcfg({text_size:'sehr_gross'}),'sehr groß');
  await cmpRows(bcfg({label_size:1.6}),'label_size');
  // #46 (Joe): Zusatzwerte (extra) der Batterie-Kachel in derselben Groesse wie Ladestand und "Voll um" (normal und breit)
  const xtRows=async(c,label)=>{e=mount(c);await wait(700);const a=q(e,'[data-k="bat"] .soc-row'),x=q(e,'[data-k="bat"] .xr');
    const fa=getComputedStyle(a).fontSize,fx=getComputedStyle(x).fontSize,wa=getComputedStyle(a.querySelector('b')).fontWeight,wx=getComputedStyle(x.querySelector('b')).fontWeight;
    ok('Zusatzwerte '+label+': gleiche Größe wie Ladestand',!!a&&!!x&&fa===fx,fa+' gegen '+fx);
    ok('Zusatzwerte '+label+': Werte gleich stark',wa===wx,wa+' gegen '+wx);};
  const xcfg=(o)=>bcfg(Object.assign({battery:{power:'sensor.bat',soc:'sensor.soc',capacity_kwh:10,extra:[{entity:'sensor.soc',name:'SOH'}]}},o||{}));
  host=document.getElementById('host');host.style.maxWidth='1100px';await xtRows(xcfg(),'breit');
  host.style.maxWidth='760px';await xtRows(xcfg(),'normal');
  host.style.maxWidth='1100px';await xtRows(xcfg({text_size:'sehr_gross'}),'sehr groß');
  await xtRows(xcfg({label_size:1.6}),'label_size');
  // #48 (Joe): Tageswerte unten: Zahlen stehen in einer Reihe auf gleicher Hoehe, auch wenn eine Beschriftung zweizeilig umbricht
  const D=(v)=>S(v,'kWh');Object.assign(hass.states,{'sensor.dpv':D(2.2),'sensor.dimp':D(0.9),'sensor.dexp':D(0),'sensor.dchg':D(1.1),'sensor.ddis':D(1.2)});
  document.getElementById('host').style.maxWidth='440px';
  e=mount(cfg({pv:{entity:'sensor.pv',daily:'sensor.dpv'},grid:{entity:'sensor.grid',daily_import:'sensor.dimp',daily_export:'sensor.dexp'},battery:{power:'sensor.bat',soc:'sensor.soc',capacity_kwh:10,daily_charge:'sensor.dchg',daily_discharge:'sensor.ddis'},text_size:'gross'}));await wait(800);
  const st=qa(e,'.stat');const rows={};st.forEach(s=>{const r=s.getBoundingClientRect(),b=s.querySelector('b').getBoundingClientRect();(rows[Math.round(r.top)]=rows[Math.round(r.top)]||[]).push({lbl:s.querySelector('span').getBoundingClientRect().height,bot:Math.round(b.bottom),tb:Math.round(r.bottom)});});
  const multi=Object.values(rows).filter(a=>a.length>1);const wrapped=multi.some(a=>Math.max(...a.map(z=>z.lbl))>Math.min(...a.map(z=>z.lbl))+4);
  ok('Tageswerte: mindestens eine Reihe mit zweizeiliger Beschriftung (Testlage)',wrapped);
  ok('Tageswerte: Zahlen einer Reihe auf gleicher Höhe',multi.every(a=>Math.max(...a.map(z=>z.bot))-Math.min(...a.map(z=>z.bot))<=1),JSON.stringify(multi.map(a=>a.map(z=>z.bot))));
  document.getElementById('host').style.maxWidth='1100px';
  // Kurzansicht: große Kachel bleibt einspaltig
  e=mount(cfg({compact:'immer'}));await wait(500);
  ok('Kurzansicht: große Kachel einspaltig',getComputedStyle(q(e,'[data-k="c0"]')).gridColumnStart==='auto',getComputedStyle(q(e,'[data-k="c0"]')).gridColumnStart);

  document.getElementById('res').textContent=`${fail?'FEHLER '+fail:'ALLE OK'}\n`+lines.join('\n');
}
const P=new URLSearchParams(location.search);
if(P.get('test')){document.getElementById('host').style.height='0';run();}
else{if(P.get('w'))document.getElementById('host').style.maxWidth=P.get('w')+'px';const c=cfg();if(P.get('ts'))c.text_size=P.get('ts');if(P.get('kurz'))c.compact='immer';mount(c);}
</script></body></html>
