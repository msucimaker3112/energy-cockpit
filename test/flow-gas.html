<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>energy-cockpit Gas und Wasser Test</title>
<style>html,body{margin:0;background:#05070d;color:#e8eefc;font-family:system-ui}#host{margin:0 auto;padding:8px}#res{white-space:pre-wrap;font:12px monospace;padding:8px}</style></head>
<body><div id="host"></div><div id="res"></div>
<script src="_icons.js"></script><script src="../dist/energy-cockpit.js"></script><script src="_theme.js"></script>
<script>
/* Prüft #65: Gas- und Wasser-Kachel mit Linie zum Haus, ohne Einfluss auf den Strom. Aufruf: ?test=1&still=1, ohne test zeigt die Seite die Karte (?case=voll|tag|m3|m3k|via|ohnebat&style=3d&kurz=1&w=Breite) */
const P=new URLSearchParams(location.search);
const S=(v,u)=>({state:String(v),attributes:{unit_of_measurement:u||'W'},last_updated:'x'});
const st={'sensor.pv':S(2400),'sensor.grid':S(150),'sensor.bat':S(800),'sensor.soc':S(64,'%'),'sensor.h':S(1200),
 'sensor.gas_p':S(8.4,'kW'),'sensor.gas_h':S(12.4,'kWh'),'sensor.gas_w':S(3.1,'kWh'),'sensor.gas_d':S(15.5,'kWh'),'sensor.gas_m3':S(1.5,'m³'),'sensor.gas_m3w':S(0.3,'m³'),
 'sensor.w_fl':S(6.5,'L/min'),'sensor.w_d':S(0.184,'m³'),'sensor.w_dl':S(184,'L')};
const hass={states:st};
const base={pv:{entity:'sensor.pv'},grid:{entity:'sensor.grid'},battery:{power:'sensor.bat',soc:'sensor.soc',capacity_kwh:10},home:{entity:'sensor.h'}};
const cases={
  voll:{...base,gas:{entity:'sensor.gas_p',heating:'sensor.gas_h',hot_water:'sensor.gas_w'},water:{entity:'sensor.w_fl',daily:'sensor.w_d'}},
  tag:{...base,gas:{heating:'sensor.gas_h',hot_water:'sensor.gas_w'},water:{daily:'sensor.w_dl'}},
  m3:{...base,gas:{heating:'sensor.gas_m3',hot_water:'sensor.gas_m3w'}},
  m3k:{...base,gas:{heating:'sensor.gas_m3',hot_water:'sensor.gas_m3w',kwh_per_m3:10.5}},
  via:{...base,pv_to_battery:'direkt',battery:{power_out:'sensor.bat',soc:'sensor.soc',capacity_kwh:2},gas:{daily:'sensor.gas_d'}},
  ohnebat:{pv:{entity:'sensor.pv'},grid:{entity:'sensor.grid'},gas:{entity:'sensor.gas_p',daily:'sensor.gas_d'},water:{daily:'sensor.w_d'}},
  ohne:base,
};
function mount(c,w){const host=document.getElementById('host');host.style.width=(w||900)+'px';host.innerHTML='';const e=document.createElement('energy-cockpit-flow-card');e.setConfig(JSON.parse(JSON.stringify(c)));host.appendChild(e);e.hass=hass;return e;}
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const q=(e,s)=>e.shadowRoot.querySelector(s),qa=(e,s)=>[...e.shadowRoot.querySelectorAll(s)];
const lines=[];let fail=0;const ok=(n,v,x)=>{if(!v)fail++;lines.push((v?'OK   ':'FAIL ')+n+(x!==undefined?' -> '+x:''));};
const txt=(e,s)=>{const x=q(e,s);if(x&&/ \.val$/.test(s))return (x.querySelector('.num').textContent+' '+x.querySelector('.unit').textContent).trim();return x?x.textContent.replace(/\s+/g,' ').trim():'';};
async function run(){
  let e=mount(cases.ohne);await wait(700);
  const home0=txt(e,'.core .val'),aut0=txt(e,'[data-p="aut"]');
  ok('ohne gas/water: keine Kacheln, kein Seitenblock',!q(e,'[data-k="gas"]')&&!q(e,'.side'));
  for(const st3 of ['flat','3d']){
    const sx=st3==='3d'?{style:'3d'}:{};
    e=mount({...cases.voll,...sx});await wait(800);
    const tag=' ['+st3+']';
    ok('Gas- und Wasser-Kachel da'+tag,!!q(e,'[data-k="gas"]')&&!!q(e,'[data-k="water"]'));
    ok('Gas: großer Wert ist die Leistung 8,40 kW'+tag,txt(e,'[data-k="gas"] .val')==='8,40 kW',txt(e,'[data-k="gas"] .val'));
    ok('Gas: Zeilen Heizung, Warmwasser, Heute'+tag,/Heizung 12,4 kWh/.test(txt(e,'.gas .sub'))&&/Warmwasser 3,1 kWh/.test(txt(e,'.gas .sub'))&&/Heute 15,5 kWh/.test(txt(e,'.gas .sub')),txt(e,'.gas .sub'));
    ok('Gas: Tag "Heizt"'+tag,txt(e,'.gas .tag')==='Heizt',txt(e,'.gas .tag'));
    ok('Wasser: Durchfluss 6,5 l/min, heute 184 L'+tag,txt(e,'[data-k="water"] .val')==='6,5 l/min'&&/Heute 184 L/.test(txt(e,'.water .sub')),txt(e,'[data-k="water"] .val')+' / '+txt(e,'.water .sub'));
    ok('Strom unverändert: Hausverbrauch und Autarkie wie ohne Gas'+tag,(st3==='3d'||txt(e,'.core .val')===home0)&&txt(e,'[data-p="aut"]')===aut0,txt(e,'.core .val')+' / '+txt(e,'[data-p="aut"]'));
    const lg=q(e,'g[data-l="gas"]'),lw=q(e,'g[data-l="water"]');
    ok('Linien zum Haus, aktiv, in Gasfarbe'+tag,!!lg&&lg.classList.contains('on')&&/249,115,22/.test(lg.style.getPropertyValue('--c'))&&!!lw&&lw.classList.contains('on'),lg&&lg.style.getPropertyValue('--c'));
    ok('Linie hat einen Weg'+tag,(lg.querySelector('path').getAttribute('d')||'').length>10);
    const rb=q(e,'[data-k="bat"]').getBoundingClientRect(),rg=q(e,'[data-k="gas"]').getBoundingClientRect(),rw=q(e,'[data-k="water"]').getBoundingClientRect();
    ok('Platz: rechts unter der Batterie'+tag,Math.abs(rg.left-rb.left)<2&&rg.top>=rb.bottom-1&&rw.top>=rg.bottom-1,[rb.bottom,rg.top,rw.top].map(Math.round).join(' / '));
    if(st3==='3d')ok('3D: Therme und Wasserzähler gezeichnet',!!q(e,'[data-o="gas"] svg')&&!!q(e,'[data-o="water"] svg'));
  }
  e=mount(cases.tag);await wait(700);
  ok('ohne Leistung: großer Wert ist heute 15,5 kWh',txt(e,'[data-k="gas"] .val')==='15,5 kWh',txt(e,'[data-k="gas"] .val'));
  ok('ohne Leistung: Tag "Heute", Zeilen Heizung und Warmwasser',txt(e,'.gas .tag')==='Heute'&&/Heizung 12,4 kWh/.test(txt(e,'.gas .sub'))&&!/Heute/.test(txt(e,'.gas .sub')),txt(e,'.gas .sub'));
  ok('ohne Leistung: Linie aktiv, solange heute verbraucht',q(e,'g[data-l="gas"]').classList.contains('on'));
  ok('Wasser nur Tageswert in Litern: 184 L',txt(e,'[data-k="water"] .val')==='184 L',txt(e,'[data-k="water"] .val'));
  e=mount(cases.m3);await wait(700);
  ok('m³ ohne kwh_per_m3: Anzeige in m³ (1,80 m³)',txt(e,'[data-k="gas"] .val')==='1,80 m³'&&/Heizung 1,50 m³/.test(txt(e,'.gas .sub')),txt(e,'[data-k="gas"] .val')+' / '+txt(e,'.gas .sub'));
  e=mount(cases.m3k);await wait(700);
  ok('m³ mit kwh_per_m3 10,5: 18,9 kWh',txt(e,'[data-k="gas"] .val')==='18,9 kWh'&&/Heizung 15,8 kWh/.test(txt(e,'.gas .sub')),txt(e,'[data-k="gas"] .val')+' / '+txt(e,'.gas .sub'));
  e=mount(cases.ohnebat);await wait(700);
  ok('ohne Batterie: Gas und Wasser rechts neben dem Haus',!!q(e,'.side-bat [data-k="gas"]')&&q(e,'[data-k="gas"]').getBoundingClientRect().left>q(e,'.hub').getBoundingClientRect().right,q(e,'[data-k="gas"]').getBoundingClientRect().left);
  e=mount(cases.via);await wait(700);
  ok('pv_to_battery direkt: Gas unter dem Netz',!!q(e,'.side-grid [data-k="grid"]')&&!!q(e,'.side-grid [data-k="gas"]'));
  e=mount({...cases.voll,compact:true},420);await wait(700);
  ok('Kurzansicht: Kacheln da, Wert sichtbar',q(e,'[data-k="gas"]').offsetHeight>0&&txt(e,'[data-k="gas"] .val')==='8,40 kW');
  e=mount({...cases.voll},380);await wait(700);
  ok('schmal (Handy): Gas in der Batteriespalte',q(e,'.wrap').classList.contains('narrow')&&Math.abs(q(e,'[data-k="gas"]').getBoundingClientRect().left-q(e,'[data-k="bat"]').getBoundingClientRect().left)<2);
  e=mount({...cases.voll,colors:{gas:'#123456'}});await wait(700);
  ok('colors.gas färbt die Linie',/18,52,86/.test(q(e,'g[data-l="gas"]').style.getPropertyValue('--c')),q(e,'g[data-l="gas"]').style.getPropertyValue('--c'));
  document.getElementById('res').textContent=(fail?fail+' FEHLER':'ALLE OK')+'\n'+lines.join('\n');
}
if(P.get('test'))run();else{const c={...(cases[P.get('case')||'voll'])};if(P.get('style'))c.style=P.get('style');if(P.get('kurz'))c.compact=true;mount(c,+(P.get('w')||900));}
</script></body></html>
