<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>energy-cockpit Temperatur je Speicher Test</title>
<style>html,body{margin:0;background:#05070d;color:#e8eefc;font-family:system-ui}#host{max-width:1200px;margin:0 auto;padding:8px}#res{white-space:pre-wrap;font:12px monospace;padding:8px}</style></head>
<body><div id="host"></div><div id="res"></div>
<script src="_icons.js"></script><script src="../dist/energy-cockpit.js"></script><script src="_theme.js"></script>
<script>
/* Prüft battery.temp und batteries[].temp mit frei gewählten Sensoren. Aufruf: ?test=1&still=1, ohne test zeigt die Seite die Karte (&w=Breite, &kurz=1) */
const S=(v,u)=>({state:String(v),attributes:{unit_of_measurement:u||'W'},last_updated:'x'});
const hassFor=(o)=>({states:Object.assign({'sensor.pv':S(800),'sensor.grid':S(100),'sensor.a':S(200),'sensor.b':S(100),'sensor.sa':S(64,'%'),'sensor.sb':S(22,'%'),'sensor.irgendein_name':S(24.56,'°C'),'sensor.ganz_anders':S(31,'°C'),'sensor.fahrenheit':S(75.2,'°F')},o||{}),language:'de',locale:{language:'de'},config:{currency:'EUR'},callApi:async()=>[],callWS:async()=>({})});
const cfg={pv:{entity:'sensor.pv'},grid:{entity:'sensor.grid'},battery:{name:'Eins',power:'sensor.a',soc:'sensor.sa',capacity_kwh:2,temp:'sensor.irgendein_name'},batteries:[{name:'Zwei',power:'sensor.b',soc:'sensor.sb',capacity_kwh:2,temp:'sensor.ganz_anders'}]};
function mount(c,h){const host=document.getElementById('host');host.innerHTML='';const e=document.createElement('energy-cockpit-flow-card');e.setConfig(JSON.parse(JSON.stringify(c)));host.appendChild(e);e.hass=h;return e;}
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const q=(e,s)=>e.shadowRoot.querySelector(s);
const t=(e,s)=>{const x=q(e,s);return x?x.textContent.trim():null;};
const lines=[];let fail=0;
const ok=(n,v,x)=>{if(!v)fail++;lines.push((v?'OK   ':'FAIL ')+n+(x!==undefined?' -> '+x:''));};
async function run(){
  let e=mount(cfg,hassFor());await wait(700);
  ok('Erster Speicher: frei gewählter Sensor',t(e,'[data-k="bat"] .temp-txt')==='24,6 °C',t(e,'[data-k="bat"] .temp-txt'));
  ok('Zweiter Speicher: eigener Sensor',t(e,'[data-k="bat2"] .temp-txt')==='31,0 °C',t(e,'[data-k="bat2"] .temp-txt'));
  ok('Tipp öffnet den Verlauf des Temperatur-Sensors',q(e,'[data-k="bat"] .temp-txt').closest('[data-e]').dataset.e==='sensor.irgendein_name');
  ok('Tipp auf den Ladestand bleibt beim Ladestand',q(e,'[data-k="bat"] .soc-txt').closest('[data-e]').dataset.e==='sensor.sa');
  e.hass=hassFor({'sensor.irgendein_name':S(30,'°C')});await wait(100);
  ok('neuer Wert erscheint',t(e,'[data-k="bat"] .temp-txt')==='30,0 °C',t(e,'[data-k="bat"] .temp-txt'));
  e=mount({...cfg,battery:{...cfg.battery,temp:'sensor.fahrenheit'}},hassFor());await wait(600);
  ok('Einheit kommt vom Sensor',t(e,'[data-k="bat"] .temp-txt')==='75,2 °F',t(e,'[data-k="bat"] .temp-txt'));
  e=mount(cfg,hassFor({'sensor.irgendein_name':S('unavailable','°C')}));await wait(600);
  ok('nicht verfügbar: Strich',t(e,'[data-k="bat"] .temp-txt')==='—');
  const miss=hassFor();delete miss.states['sensor.ganz_anders'];
  e=mount(cfg,miss);await wait(600);
  ok('Sensor fehlt: Strich statt Absturz',t(e,'[data-k="bat2"] .temp-txt')==='—');
  e=mount({...cfg,battery:{name:'Eins',power:'sensor.a',soc:'sensor.sa',capacity_kwh:2},batteries:[]},hassFor());await wait(600);
  ok('ohne temp: keine Zeile',!q(e,'.temp-txt'));
  document.getElementById('res').textContent=`${fail?'FEHLER '+fail:'ALLE OK'}\n`+lines.join('\n');
}
const P=new URLSearchParams(location.search);
if(P.get('test')){document.getElementById('host').style.height='0';run();}
else{if(P.get('w'))document.getElementById('host').style.maxWidth=P.get('w')+'px';const c={...cfg};if(P.get('kurz'))c.compact='immer';mount(c,hassFor());}
</script></body></html>
