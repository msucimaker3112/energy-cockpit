<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>energy-cockpit Tagesertrag ohne Akku-Ladung Test</title>
<style>html,body{margin:0;background:#05070d;color:#e8eefc;font-family:system-ui}#host{max-width:1100px;margin:0 auto;padding:8px}#res{white-space:pre-wrap;font:12px monospace;padding:8px}</style></head>
<body><div id="host"></div><div id="res"></div>
<script src="_icons.js"></script><script src="../dist/energy-cockpit.js"></script><script src="_theme.js"></script>
<script>
/* Prüft pv.daily_ac mit den Werten einer echten Hybrid-Anlage. Aufruf: ?test=1&still=1 */
const S=(v,u)=>({state:String(v),attributes:{unit_of_measurement:u||'W'},last_updated:'x'});
const hassFor=(o)=>({states:Object.assign({'sensor.pv':S(6000),'sensor.grid':S(-4600),'sensor.bat':S(0),'sensor.soc':S(100,'%'),'sensor.y':S(6.67,'kWh'),'sensor.y2':S(1,'kWh'),'sensor.imp':S(6,'kWh'),'sensor.exp':S(2.99,'kWh'),'sensor.chg':S(6.76,'kWh'),'sensor.dis':S(0.01,'kWh'),'sensor.chg2':S(1,'kWh'),'sensor.dis2':S(0,'kWh'),'sensor.bat2':S(0),'sensor.soc2':S(50,'%')},o||{}),language:'de',locale:{language:'de'},config:{currency:'EUR'},callApi:async()=>[],callWS:async()=>({})});
const bat={power:'sensor.bat',soc:'sensor.soc',capacity_kwh:7.5,daily_charge:'sensor.chg',daily_discharge:'sensor.dis'};
const base={pv:{entity:'sensor.pv',daily:'sensor.y'},grid:{entity:'sensor.grid',daily_import:'sensor.imp',daily_export:'sensor.exp'},battery:bat};
const on={...base,pv:{...base.pv,daily_ac:true}};
function mount(c,h){const host=document.getElementById('host');host.innerHTML='';const e=document.createElement('energy-cockpit-flow-card');e.setConfig(JSON.parse(JSON.stringify(c)));host.appendChild(e);e.hass=h;return e;}
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
const t=(e,k)=>{const x=e.shadowRoot.querySelector('[data-s="'+k+'"] b');return x?x.textContent.trim():null;};
const lines=[];let fail=0;
const ok=(n,v,x)=>{if(!v)fail++;lines.push((v?'OK   ':'FAIL ')+n+(x!==undefined?' -> '+x:''));};
async function run(){
  let e=mount(base,hassFor());await wait(600);
  ok('ohne Option: PV wie bisher',/^6,7/.test(t(e,'pv')),t(e,'pv'));
  ok('ohne Option: Haus wie bisher',/^2,9/.test(t(e,'home')),t(e,'home'));
  ok('ohne Option: Autarkie wie bisher',t(e,'aut')==='0 %',t(e,'aut'));
  e=mount(on,hassFor());await wait(600);
  ok('mit Option: PV mit Akku-Ladung',/^13,4/.test(t(e,'pv')),t(e,'pv'));
  ok('mit Option: Haus',/^9,7/.test(t(e,'home')),t(e,'home'));
  ok('mit Option: Autarkie',t(e,'aut')==='38 %',t(e,'aut'));
  ok('mit Option: Bezug und Einspeisung bleiben',/^6,0/.test(t(e,'imp'))&&/^3,0/.test(t(e,'exp')),t(e,'imp')+' / '+t(e,'exp'));
  e=mount({...on,battery:{power:'sensor.bat',soc:'sensor.soc',capacity_kwh:7.5}},hassFor());await wait(600);
  ok('ohne Akku-Sensoren: Tagesertrag bleibt',/^6,7/.test(t(e,'pv')),t(e,'pv'));
  e=mount(on,hassFor({'sensor.chg':S('unavailable','kWh')}));await wait(600);
  ok('Akku-Sensor nicht verfügbar: kein Absturz',t(e,'pv')!==null&&!/NaN/.test(t(e,'pv')),t(e,'pv'));
  e=mount({...on,batteries:[{name:'Stecker',power:'sensor.bat2',soc:'sensor.soc2',capacity_kwh:2,daily_charge:'sensor.chg2',daily_discharge:'sensor.dis2',behind_meter:true}]},hassFor());await wait(600);
  ok('Speicher hinter dem Zähler zählt nicht mit',/^13,4/.test(t(e,'pv')),t(e,'pv'));
  e=mount({...on,pv2:{entity:'sensor.pv',daily:'sensor.y2'}},hassFor());await wait(600);
  ok('zweite Anlage wird addiert',/^14,4/.test(t(e,'pv')),t(e,'pv'));
  document.getElementById('res').textContent=`${fail?'FEHLER '+fail:'ALLE OK'}\n`+lines.join('\n');
}
if(new URLSearchParams(location.search).get('test'))run();else mount(on,hassFor());
</script></body></html>
